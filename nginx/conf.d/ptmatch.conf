# =============================================================================
# PTMatch — nginx reverse proxy (chạy trong docker compose, network nội bộ
# resolve được service name: backend, frontend).
#
# Cert Let's Encrypt: /etc/letsencrypt/live/ptmatch.vn/ (mount từ ./certbot/conf).
# Lần đầu chưa có cert: chạy scripts/setup-server.sh để xin cert qua webroot
# (nginx sẽ fail tới khi cert tồn tại — có thể comment tạm server 443 nếu cần).
# =============================================================================

# Gửi đúng scheme/host cho app phía sau
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP: ACME challenge + redirect HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ptmatch.vn www.ptmatch.vn;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck của container: chỉ nginx tự trả lời, không đụng tới backend.
    # Nằm ở cổng 80 để không phải phụ thuộc cert khi kiểm tra từ trong container.
    location = /.well-known/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: app chính --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ptmatch.vn www.ptmatch.vn;

    ssl_certificate     /etc/letsencrypt/live/ptmatch.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ptmatch.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Upload ảnh portfolio/review tối đa ~15MB
    client_max_body_size 15m;

    # ---- Security headers ---------------------------------------------------
    # `always` để header có mặt cả trên trang lỗi (4xx/5xx), không chỉ 200.
    #
    # HSTS: buộc trình duyệt chỉ dùng HTTPS cho lần sau. Không có nó, lần đầu ai
    # đó gõ "ptmatch.vn" là một request HTTP trần có thể bị chặn giữa đường trước
    # khi kịp redirect. Bắt đầu bằng 1 năm; CHƯA thêm `preload` cho tới khi chắc
    # chắn mọi subdomain đều chạy HTTPS, vì danh sách preload rất khó gỡ ra.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chặn trình duyệt tự đoán kiểu nội dung — quan trọng vì /media phục vụ file
    # do người dùng tải lên.
    add_header X-Content-Type-Options "nosniff" always;

    # Chống nhúng site vào iframe để lừa bấm (clickjacking) trên dashboard PT.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Không gửi kèm đường dẫn đầy đủ sang site khác. Với PTMatch, referrer có thể
    # để lộ chính hồ sơ PT mà người dùng đang xem.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Không tính năng nào dưới đây được dùng; tắt hẳn để script nhúng (nếu có)
    # cũng không xin được.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # GHI ĐÈ, không nối thêm ($proxy_add_x_forwarded_for): nginx là cổng vào
    # duy nhất (backend/frontend không lộ ra ngoài), nên IP client thật luôn là
    # $remote_addr. Nối thêm thay vì ghi đè cho phép client tự đặt header
    # X-Forwarded-For với entry giả ở đầu chuỗi — uvicorn (--forwarded-allow-ips
    # "*") và slowapi (get_remote_address) tin entry TRÁI NHẤT, nên client có
    # thể tự chọn "IP" định mức rate-limit của mình, vô hiệu hoá throttle trên
    # /auth/login, /auth/admin/login, /auth/forgot-password, v.v.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    # Backend API — KHÔNG strip prefix, backend mount sẵn /api
    location /api {
        proxy_pass http://backend:8000;
    }

    # Media local fallback (khi STORAGE_BACKEND=local; production dùng GCS/CDN)
    location /media {
        proxy_pass http://backend:8000;
    }

    # Next.js frontend (SSR)
    location / {
        proxy_pass http://frontend:3000;
    }
}
