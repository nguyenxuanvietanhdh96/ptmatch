# Production stack — chạy trên GCE instance.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Log rotation áp cho MỌI service qua anchor `&logging` bên dưới. Mặc định của
# Docker là json-file không giới hạn: access log của nginx và uvicorn sẽ ăn dần
# đĩa 30GB cho tới khi đầy, và cái chết trước tiên là Postgres.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    # Trần an toàn, không phải kích cỡ đã tinh chỉnh: máy tham chiếu là VPS/GCE
    # 2GB (xem ghi chú DEPLOY_MODE=build ở scripts/deploy.sh). Mục đích là chặn
    # MỘT service rò rỉ bộ nhớ nuốt hết RAM của những service khác — không phải
    # định mức hiệu năng. Máy nhiều RAM hơn thì nâng qua file override, không
    # cần sửa ở đây.
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-ptmatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-ptmatch}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *logging
    mem_limit: 128m
    # --appendonly: không có nó thì Redis prod chỉ sống trong RAM. Redis ở đây
    # giữ denylist refresh-token bị thu hồi (logout, reset mật khẩu) và bộ đếm
    # rate-limit — một lần restart container (deploy, OOM, reboot host) mà mất
    # sạch là token "đã thu hồi" sống lại tới hết hạn (30 ngày).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    # Có CẢ `image:` và `build:` — deploy.sh chọn một trong hai bằng DEPLOY_MODE,
    # và không bao giờ để Compose tự quyết.
    #
    # Lịch sử: trước đây `pull --ignore-buildable` âm thầm bỏ qua service có
    # `build:` rồi `up` build lại từ code cũ trên server — deploy báo thành công
    # trong khi chạy code cũ. Cách chặn không phải là bỏ `build:`, mà là để
    # deploy.sh dùng `up --no-build` ở chế độ pull. Xem scripts/deploy.sh.
    image: ${BACKEND_IMAGE:-ptmatch-backend:latest}
    build: ./backend
    logging: *logging
    mem_limit: 512m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ptmatch}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      # STORAGE_BACKEND CỐ Ý KHÔNG đặt ở đây — để .env quyết định.
      #
      # Giá trị trong `environment:` ghi đè `env_file:`, nên hardcode ở đây biến
      # STORAGE_BACKEND trong .env thành công tắc không nối với gì. Một server
      # tự host thì dùng `local`, khi chuyển sang GCS thì đổi đúng một dòng .env.
      #
      # Volume media bên dưới được mount trong MỌI trường hợp: dùng GCS thì nó
      # chỉ nằm không (vô hại), nhưng nhờ vậy việc chuyển qua lại không cần sửa
      # file compose nào.
      #
      # KHÔNG đặt STORAGE_BACKEND ở đây kể cả khi muốn mặc định gcs — xem trên.
      # Backend không publish port ra ngoài — chỉ nginx nội bộ gọi tới, nên tin
      # X-Forwarded-For là an toàn và cần thiết để rate limit tính đúng IP client.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # BIND MOUNT, không phải named volume — cố ý.
      #
      # Ảnh người dùng tải lên là dữ liệu duy nhất ngoài DB cần backup, và named
      # volume không có đường dẫn trên host nên muốn sao lưu phải chạy container
      # tạm để tar ra. Bind mount thì `rsync /opt/ptmatch/media` là xong, và
      # `ls` là thấy file — quan trọng khi backup nghĩa là kéo về máy cá nhân
      # (xem scripts/backup-to-local.sh).
      #
      # Thư mục trên host phải thuộc uid 1000: container chạy user `appuser`
      # uid 1000 (backend/Dockerfile). scripts/setup-server.sh tự tạo và chown.
      - ./media:/app/media
    restart: unless-stopped
    # `restart: unless-stopped` chỉ khởi động lại tiến trình đã CHẾT. Một uvicorn
    # treo (kẹt event loop, mất kết nối DB) vẫn "đang chạy" nên không bao giờ được
    # dựng lại; healthcheck là thứ biến trạng thái đó thành nhìn thấy được, và là
    # điều kiện để deploy.sh biết khi nào backend thật sự sẵn sàng.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # Xem ghi chú ở service backend về image/build và DEPLOY_MODE.
    # NEXT_PUBLIC_* được nhúng vào bundle lúc build (từ frontend/.env.production).
    image: ${FRONTEND_IMAGE:-ptmatch-frontend:latest}
    build:
      context: ./frontend
      target: runner
    logging: *logging
    mem_limit: 512m
    environment:
      API_INTERNAL_URL: http://backend:8000
      SITE_URL: ${SITE_URL:?required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    logging: *logging
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/.well-known/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
