# =============================================================================
# requirements.lock — phiên bản CHÍNH XÁC dùng để build ảnh production.
#
# Vì sao cần: requirements.txt chỉ nêu khoảng phiên bản, nên mỗi lần build lại
# giải ra một tổ hợp khác. Ảnh đã chạy qua test ở CI và ảnh deploy lên prod có
# thể lệch nhau mà không ai đổi một dòng code nào — và lỗi kiểu đó luôn nổ vào
# lúc khó lần nhất.
#
# requirements.txt vẫn là nơi khai báo ý định (thư viện nào, khoảng nào);
# file này là kết quả đã chốt.
#
# Cập nhật sau khi sửa requirements.txt:
#   docker compose exec backend pip freeze > backend/requirements.lock
