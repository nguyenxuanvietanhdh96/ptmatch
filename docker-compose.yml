# =============================================================================
# BASE stack — đây là cấu hình PRODUCTION.
#
# Vì sao base là prod chứ không phải dev: Compose tự nạp thêm
# `docker-compose.override.yml` khi bạn gõ `docker compose up` KHÔNG kèm `-f`.
# Server không bao giờ đi đường đó: mọi lệnh phía server truyền `-f` tường minh,
# và khi có `-f` thì Compose bỏ qua file override. Trước đây base là dev —
# hệ quả là một lần `docker compose up` trên server khởi động mailpit, không có
# nginx, và `ENVIRONMENT` bị ép về `development` (tắt hết guard của config.py).
#
#   máy dev :  docker compose up            -> base + override.yml, KHÔNG có nginx
#   server  :  docker compose -f docker-compose.yml --profile prod up -d
#              (scripts/deploy.sh làm sẵn; `-f` tường minh còn chặn luôn việc
#               một file override bỏ quên trên server được merge vào)
#
# Log rotation áp cho MỌI service qua anchor `&logging`. Mặc định của Docker là
# json-file không giới hạn: access log của nginx và uvicorn sẽ ăn dần đĩa 30GB
# cho tới khi đầy, và cái chết trước tiên là Postgres.
# =============================================================================
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    # Trần an toàn, không phải kích cỡ đã tinh chỉnh: máy tham chiếu là VPS/GCE
    # 2GB (xem ghi chú DEPLOY_MODE=build ở scripts/deploy.sh). Mục đích là chặn
    # MỘT service rò rỉ bộ nhớ nuốt hết RAM của những service khác — không phải
    # định mức hiệu năng. Máy nhiều RAM hơn thì nâng qua file override.
    mem_limit: 512m
    environment:
      # DÙNG `:-` CHỨ KHÔNG `:?required` — cố ý, và không phải vì lỏng tay.
      #
      # Compose nội suy biến của TỪNG FILE trước khi merge, nên một `:?required`
      # ở đây sẽ nổ ngay cả khi file override định thay giá trị đó — tức là phá
      # luôn đường `clone xong chạy được ngay` của máy dev (không có .env).
      #
      # Bảo đảm cho production nằm ở chỗ khác và mạnh hơn: `require_prod_env()`
      # trong scripts/lib-require-env.sh chặn deploy nếu POSTGRES_PASSWORD /
      # SECRET_KEY còn là placeholder, kèm thông báo nói rõ phải làm gì — cùng
      # nguyên tắc "sai cấu hình phải nổ lúc deploy" của app/core/config.py.
      POSTGRES_USER: ${POSTGRES_USER:-ptmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptmatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ptmatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptmatch} -d ${POSTGRES_DB:-ptmatch}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *logging
    mem_limit: 128m
    # --appendonly: không có nó thì Redis chỉ sống trong RAM. Redis ở đây giữ
    # denylist refresh-token bị thu hồi (logout, reset mật khẩu) và bộ đếm
    # rate-limit — một lần restart container (deploy, OOM, reboot host) mà mất
    # sạch là token "đã thu hồi" sống lại tới hết hạn (30 ngày).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # KHÔNG publish ra host, ở cả hai môi trường. Redis không có auth, và không
    # có gì cần chạm tới nó từ host: backend gọi redis://redis:6379 trong network
    # compose, test chạy bằng `docker compose exec backend pytest` nên cũng ở
    # trong đó. Soi Redis thì: docker compose exec redis redis-cli
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    # Có CẢ `image:` và `build:` — deploy.sh chọn một trong hai bằng DEPLOY_MODE,
    # và không bao giờ để Compose tự quyết.
    #
    # Lịch sử: trước đây `pull --ignore-buildable` âm thầm bỏ qua service có
    # `build:` rồi `up` build lại từ code cũ trên server — deploy báo thành công
    # trong khi chạy code cũ. Cách chặn không phải là bỏ `build:`, mà là để
    # deploy.sh dùng `up --no-build` ở chế độ pull. Xem scripts/deploy.sh.
    image: ${BACKEND_IMAGE:-ptmatch-backend:latest}
    build: ./backend
    logging: *logging
    mem_limit: 512m
    # required: false để máy dev chưa có .env vẫn chạy được. Server thì
    # deploy.sh đã chặn cứng nếu thiếu .env, nên đây không phải lỗ hổng.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ptmatch}:${POSTGRES_PASSWORD:-ptmatch_secret}@db:5432/${POSTGRES_DB:-ptmatch}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      # STORAGE_BACKEND CỐ Ý KHÔNG đặt ở đây — để .env quyết định.
      #
      # Giá trị trong `environment:` ghi đè `env_file:`, nên hardcode ở đây biến
      # STORAGE_BACKEND trong .env thành công tắc không nối với gì. Một server
      # tự host thì dùng `local`, khi chuyển sang GCS thì đổi đúng một dòng .env.
      #
      # Backend không publish port ra ngoài — chỉ nginx nội bộ gọi tới, nên tin
      # X-Forwarded-For là an toàn và cần thiết để rate limit tính đúng IP client.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # BIND MOUNT, không phải named volume — cố ý, và dùng chung cho cả dev.
      #
      # Ảnh người dùng tải lên là dữ liệu duy nhất ngoài DB cần backup, và named
      # volume không có đường dẫn trên host nên muốn sao lưu phải chạy container
      # tạm để tar ra. Bind mount thì `rsync <APP_DIR>/media` là xong, và `ls` là
      # thấy file — quan trọng khi backup nghĩa là kéo về máy cá nhân
      # (xem scripts/backup-to-local.sh).
      #
      # Thư mục trên host phải thuộc uid 1000: container chạy user `appuser`
      # uid 1000 (backend/Dockerfile). setup-server.sh tự tạo và chown trên
      # server; ở dev thì `make dev`/`make up` mkdir trước khi gọi compose.
      - ./media:/app/media
    restart: unless-stopped
    # `restart: unless-stopped` chỉ khởi động lại tiến trình đã CHẾT. Một uvicorn
    # treo (kẹt event loop, mất kết nối DB) vẫn "đang chạy" nên không bao giờ được
    # dựng lại; healthcheck là thứ biến trạng thái đó thành nhìn thấy được, và là
    # điều kiện để deploy.sh biết khi nào backend thật sự sẵn sàng.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # Xem ghi chú ở service backend về image/build và DEPLOY_MODE.
    # NEXT_PUBLIC_* được nhúng vào bundle lúc build (từ frontend/.env.production).
    image: ${FRONTEND_IMAGE:-ptmatch-frontend:latest}
    build:
      context: ./frontend
      target: runner
    logging: *logging
    mem_limit: 512m
    environment:
      # Mặc định trống: trình duyệt gọi /api cùng origin, Next rewrite xuống
      # backend. Đặt giá trị chỉ khi API nằm ở domain khác.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      API_INTERNAL_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    # profiles: nginx CHỈ chạy ở prod. Compose không cho một file override XOÁ
    # service, nên profile là cách duy nhất để dev (base + override) không dựng
    # nó lên. deploy.sh / setup-server.sh export COMPOSE_PROFILES=prod;
    # .env trên server cũng đặt biến đó để lệnh gõ tay cũng đúng.
    profiles: ["prod"]
    image: nginx:1.27-alpine
    logging: *logging
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/.well-known/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
